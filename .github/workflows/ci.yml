name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Suite de tests (app + services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q

  mcp-server-smoke:
    name: Fumée du serveur MCP (boot réel + boucle agent)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Environnement minimal du serveur (gms/requirements.txt), pas requirements.txt
      # racine : c'est exactement ce que construit gms/Dockerfile pour Render, donc
      # ce job vérifie ce qui tourne réellement en production, pas l'environnement dev.
      # mcp est épinglé <2 : fastmcp 3.x ne supporte pas mcp 2.0 (request_ctx retiré).
      - run: pip install -r gms/requirements.txt
      # SDK acryl-datahub uniquement pour l'étape de vérification du contrat
      # (get_urns_by_filter → GraphQL, get_entities_v2 → OpenAPI v2 batch) :
      # c'est la même frontière que le mode réel du serveur MCP en production.
      - run: pip install "acryl-datahub>=0.13,<2"

      - name: Démarre le serveur GMS + MCP (streamable HTTP) en arrière-plan, en mode réel
        run: |
          # DATAHUB_GMS_URL pointe le serveur MCP sur le GMS lui-même : chaque outil
          # passe par DataHubClient (SDK + REST) et le contrat HTTP réel du graphe —
          # la même chaîne que contre un vrai GMS DataHub. Sans cette variable, le
          # serveur MCP retomberait sur le graphe mémoire (mode démo).
          DATAHUB_GMS_URL=http://127.0.0.1:8000 nohup uvicorn gms.main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          echo "Le serveur GMS n'a pas répondu à /health" && exit 1

      - name: Vérifie les 11 datasets via l'API GMS
        run: |
          count=$(curl -sf http://127.0.0.1:8000/ | python3 -c "import json,sys; print(json.load(sys.stdin)['datasets'])")
          test "$count" = "11" || { echo "attendu 11 datasets, trouvé $count"; exit 1; }

      - name: Vérifie la lecture SDK (GraphQL + OpenAPI v2 batch)
        run: |
          DATAHUB_GMS_URL=http://127.0.0.1:8000 python3 - <<'EOF'
          from datahub.ingestion.graph.client import DatahubClientConfig, DataHubGraph
          import itertools
          graph = DataHubGraph(DatahubClientConfig(server="http://127.0.0.1:8000", token=None))
          urns = list(itertools.islice(graph.get_urns_by_filter(entity_types=["dataset"], query="*"), 20))
          assert len(urns) == 11, f"attendu 11 urns via GraphQL, trouvé {len(urns)}"
          props = graph.get_entities_v2("dataset", urns[:2], aspects=["datasetProperties"])
          assert props and "datasetProperties" in props[urns[0]], "aspect datasetProperties manquant via v2 batch"
          print(f"SDK OK : {len(urns)} datasets, aspects lus pour {len(props)}")
          EOF

      - name: Vérifie les Skills et l'agent (Agent Context Kit) via l'API GMS
        run: |
          skills=$(curl -sf "http://127.0.0.1:8000/openapi/v3/entity/agentSkill/urn:li:agentSkill:freshness_sla" | python3 -c "import json,sys; r=json.load(sys.stdin)['results'][0]; print(r['aspects']['agentSkillInfo']['name'])")
          test "$skills" = "Surveillance de la fraîcheur des sources" || { echo "skill manquant : $skills"; exit 1; }
          DATAHUB_GMS_URL=http://127.0.0.1:8000 python3 - <<'EOF'
          from services.datahub_client import DataHubClient
          client = DataHubClient()
          assert len(client.list_skills()) == 3, "attendu 3 skills seedés"
          urn = client.upsert_agent("ci_agent", "Agent CI", description="d")
          assert urn is True
          print(f"SKILLS OK : {[s['id'] for s in client.list_skills()]}")
          EOF

      - name: Vérifie l'ingestion skills (dry-run, payloads conformes)
        run: python3 catalog/ingest_skills.py --dry-run | tail -2

      # Rejoue la démo agent réelle du dépôt contre le serveur qu'on vient de démarrer :
      # même code que celui documenté dans le README et examples/README.md, pas un
      # test ad hoc. Couvre les 12 outils MCP (list/get/lineage/freshness/emit_run/
      # incident create+resolve/list + skills/context Agent Context Kit) en conditions
      # réelles de protocole streamable HTTP et avec le backend réel (lecture/écriture
      # via DataHubClient).
      - name: Boucle de supervision réelle via MCP (examples/mcp_agent_demo.py)
        run: MCP_URL=http://127.0.0.1:8000/mcp python3 examples/mcp_agent_demo.py

      - name: Logs du serveur (en cas d'échec)
        if: failure()
        run: cat server.log
