source:
  type: duckdb
  config:
    platform_instance: prod
    database: ''
    schema: public
    table: ref_agro_economique
sink:
  type: datahub-rest
  config:
    server: ${DATAHUB_GMS_URL}
    token: ${DATAHUB_TOKEN}
transformers:
- type: simple_add_dataset_ownership
  config:
    ownership:
    - owner: data-team
      type: TECHNICAL_OWNER
- type: add_dataset_tags
  config:
    tags: []
- type: add_dataset_glossary_terms
  config:
    terms: []
- type: add_dataset_properties
  config:
    properties:
      niveau_de_preuve: dire_d_expert
      freshness_sla_days: '400'
      last_updated: '2025-11-15'
      spatial_coverage: France metropolitaine
      licence: Compilation de baremes publics
      redistribuable: oui
