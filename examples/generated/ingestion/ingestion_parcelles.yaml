source:
  type: duckdb
  config:
    platform_instance: prod
    database: ''
    schema: public
    table: parcelles
sink:
  type: datahub-rest
  config:
    server: ${DATAHUB_GMS_URL}
    token: ${DATAHUB_TOKEN}
transformers:
- type: simple_add_dataset_ownership
  config:
    ownership:
    - owner: data-team
      type: TECHNICAL_OWNER
- type: add_dataset_tags
  config:
    tags: []
- type: add_dataset_glossary_terms
  config:
    terms: []
- type: add_dataset_properties
  config:
    properties:
      niveau_de_preuve: mesure
      freshness_sla_days: '365'
      last_updated: '2026-03-01'
      spatial_coverage: Nouvel Espace Cher
      licence: "IGN API Carto \u2014 RPG (licence ouverte)"
      redistribuable: oui (anonymise, licence ouverte)
