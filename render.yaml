services:
  - type: web
    name: terroir-context-gms
    runtime: docker
    repo: https://github.com/faten-elouta/Agriculteur
    dockerfilePath: gms/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      # Mode réel : si DATAHUB_GMS_URL est défini, le serveur MCP (/mcp) lit et
      # écrit dans ce GMS DataHub au lieu du graphe mémoire de démonstration.
      - key: DATAHUB_GMS_URL
        sync: false
      - key: DATAHUB_TOKEN
        sync: false
